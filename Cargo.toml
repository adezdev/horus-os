[workspace]
resolver = "3"
members = ["kernel", "xtask"]
# Plain `cargo build` builds only host tools; the kernel is built for its own
# target through `cargo xtask build`.
default-members = ["xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/adezdev/horus-os"
publish = false

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
debug = true
