[package]
name = "horus-kernel"
description = "The Horus kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "horus-kernel"
test = false
bench = false

[dependencies]
limine = "0.6.5"

[features]
# Panic right before boot completes, to test the panic screen
# (`cargo xtask test`). Never enable in a real build.
panic-test = []
# Print 100 numbered lines before boot completes, so tests can check
# console scrolling against known text. Never enable in a real build.
console-test = []
